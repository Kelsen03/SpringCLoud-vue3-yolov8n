<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>前台 AI 收银流程图</title>
    <style>
        body {
            font-family: 'SimSun', '宋体', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }

        .flowchart-container {
            position: relative;
            width: 800px;
            height: 250px;
        }

        .box {
            position: absolute;
            width: 150px;
            height: 80px;
            border: 2px solid #333;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 16px;
            color: #333;
            z-index: 2;
        }

        /* 节点定位 (单排横向) */
        #box1 { top: 80px; left: 40px; }
        #box2 { top: 80px; left: 230px; }
        #box3 { top: 80px; left: 420px; }
        #box4 { top: 80px; left: 610px; }

        /* SVG 连线 */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        path {
            fill: none;
            stroke: #333;
            stroke-width: 2;
        }
    </style>
</head>
<body>

<div class="flowchart-container">
    <!-- 节点 -->
    <div id="box1" class="box">YOLOv8<br>目标检测</div>
    <div id="box2" class="box">OpenCV<br>颜色特征提取</div>
    <div id="box3" class="box">商品库匹配<br>与加入购物车</div>
    <div id="box4" class="box">订单生成<br>与库存扣减</div>

    <!-- 连线 -->
    <svg>
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
            </marker>
        </defs>

        <!-- 连线 -->
        <path d="M 190 120 L 230 120" marker-end="url(#arrow)" />
        <path d="M 380 120 L 420 120" marker-end="url(#arrow)" />
        <path d="M 570 120 L 610 120" marker-end="url(#arrow)" />
    </svg>
</div>

</body>
</html>
