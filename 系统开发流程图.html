<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统开发流程图</title>
    <style>
        body {
            font-family: 'SimSun', '宋体', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }

        .flowchart-container {
            position: relative;
            width: 800px;
            height: 400px;
        }

        .box {
            position: absolute;
            width: 140px;
            height: 80px;
            border: 2px solid #333;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 16px;
            color: #333;
            z-index: 2;
        }

        /* 节点定位 (S型排列) */
        /* 第一排：从左到右 */
        #box1 { top: 50px; left: 50px; }
        #box2 { top: 50px; left: 240px; }
        #box3 { top: 50px; left: 430px; }
        #box4 { top: 50px; left: 620px; }
        
        /* 第二排：从右到左 */
        #box5 { top: 220px; left: 620px; }
        #box6 { top: 220px; left: 430px; }
        #box7 { top: 220px; left: 240px; }
        #box8 { top: 220px; left: 50px; }

        /* SVG 连线 */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        path {
            fill: none;
            stroke: #333;
            stroke-width: 2;
        }
    </style>
</head>
<body>

<div class="flowchart-container">
    <!-- 节点 -->
    <div id="box1" class="box">需求分析与<br>微服务划分</div>
    <div id="box2" class="box">数据库设计<br>与建表</div>
    <div id="box3" class="box">Nacos与<br>网关配置</div>
    <div id="box4" class="box">后端核心<br>接口开发</div>
    
    <div id="box5" class="box">YOLO视觉<br>模型部署</div>
    <div id="box6" class="box">Vue前端<br>交互实现</div>
    <div id="box7" class="box">前后端<br>联调测试</div>
    <div id="box8" class="box">云服务器<br>打包部署</div>

    <!-- 连线 -->
    <svg>
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
            </marker>
        </defs>

        <!-- 第一排连线 -->
        <path d="M 190 90 L 240 90" marker-end="url(#arrow)" />
        <path d="M 380 90 L 430 90" marker-end="url(#arrow)" />
        <path d="M 570 90 L 620 90" marker-end="url(#arrow)" />
        
        <!-- 向下拐弯 -->
        <path d="M 690 130 L 690 220" marker-end="url(#arrow)" />

        <!-- 第二排连线 (从右向左) -->
        <path d="M 620 260 L 570 260" marker-end="url(#arrow)" />
        <path d="M 430 260 L 380 260" marker-end="url(#arrow)" />
        <path d="M 240 260 L 190 260" marker-end="url(#arrow)" />
    </svg>
</div>

</body>
</html>
