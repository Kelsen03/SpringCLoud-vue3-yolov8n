# ============================================================
# 连锁超市微服务管理系统 — Docker Compose 编排
# 11 个容器: MySQL + Redis + Nacos + 6 微服务 + AI + Nginx
# ============================================================

networks:
  supermarket-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql-data:
  redis-data:
  nacos-data:

services:

  # ============================================================
  # MySQL 8.0 — 首次启动自动建 4 个库
  # ============================================================
  mysql:
    image: mysql:8.0.36
    container_name: supermarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - supermarket-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 350M
    command:
      - --default-authentication-plugin=mysql_native_password

  # ============================================================
  # Redis 7 — 缓存
  # ============================================================
  redis:
    image: redis:7.2-alpine
    container_name: supermarket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - supermarket-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M
    command: redis-server /usr/local/etc/redis/redis.conf

  # ============================================================
  # Nacos 2.x — 服务注册中心
  # ============================================================
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: supermarket-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: embedded
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 128m
      JVM_XMX: 128m
      JVM_XMN: 64m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - supermarket-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 300M

  # ============================================================
  # Python AI 服务 — YOLOv8 商品识别
  # ============================================================
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: supermarket-ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - supermarket-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 600M

  # ============================================================
  # supermarket-gateway (8000)
  # ============================================================
  supermarket-gateway:
    build:
      context: .
      dockerfile: supermarket-gateway/Dockerfile
    container_name: supermarket-gateway
    restart: unless-stopped
    environment:
      - SERVER_PORT=8000
      - NACOS_SERVER_ADDR=nacos:8848
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8000:8000"
    networks:
      - supermarket-net
    depends_on:
      nacos:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================
  # supermarket-auth (9000)
  # ============================================================
  supermarket-auth:
    build:
      context: .
      dockerfile: supermarket-auth/Dockerfile
    container_name: supermarket-auth
    restart: unless-stopped
    environment:
      - SERVER_PORT=9000
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=supermarket_auth
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - SQL_INIT_MODE=always
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - supermarket-net
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================
  # supermarket-product (9001) — 依赖 Redis + AI 服务
  # ============================================================
  supermarket-product:
    build:
      context: .
      dockerfile: supermarket-product/Dockerfile
    container_name: supermarket-product
    restart: unless-stopped
    environment:
      - SERVER_PORT=9001
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=supermarket_product
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SQL_INIT_MODE=always
      - AI_SERVICE_URL=http://ai-service:5000
    networks:
      - supermarket-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================
  # supermarket-inventory (9002)
  # ============================================================
  supermarket-inventory:
    build:
      context: .
      dockerfile: supermarket-inventory/Dockerfile
    container_name: supermarket-inventory
    restart: unless-stopped
    environment:
      - SERVER_PORT=9002
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=supermarket_inventory
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - SQL_INIT_MODE=never
    networks:
      - supermarket-net
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================
  # supermarket-order (9003) — Feign 调用 inventory
  # ============================================================
  supermarket-order:
    build:
      context: .
      dockerfile: supermarket-order/Dockerfile
    container_name: supermarket-order
    restart: unless-stopped
    environment:
      - SERVER_PORT=9003
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=supermarket_order
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - SQL_INIT_MODE=always
    networks:
      - supermarket-net
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      supermarket-inventory:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================
  # supermarket-analysis (9004) — 定时任务 + 跨库只读
  # ============================================================
  supermarket-analysis:
    build:
      context: .
      dockerfile: supermarket-analysis/Dockerfile
    container_name: supermarket-analysis
    restart: unless-stopped
    environment:
      - SERVER_PORT=9004
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=supermarket_order
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
    networks:
      - supermarket-net
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================
  # Nginx — 前端静态文件 + API/AI 反向代理
  # ============================================================
  nginx:
    build:
      context: ./supermarket-ui
      dockerfile: Dockerfile
    container_name: supermarket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - supermarket-net
    depends_on:
      - supermarket-gateway
      - ai-service
    deploy:
      resources:
        limits:
          memory: 100M
